name: Deploy (Vercel)

# Só publica em produção se os testes passarem. Depende de 3 secrets do
# repositório (Settings → Secrets and variables → Actions): VERCEL_TOKEN,
# VERCEL_ORG_ID, VERCEL_PROJECT_ID — como conseguir cada um está no README.
#
# Importante: pra este workflow ser o único a publicar (e a gate valer de
# verdade), o projeto no Vercel precisa estar com "Git" desconectado —
# senão o Vercel também publica sozinho a cada push, sem passar pelos
# testes. Ver README para os passos completos.

on:
  push:
    branches: [main]

jobs:
  test:
    name: Testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

  deploy:
    name: Publicar no Vercel
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Configurar ambiente do projeto Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build (Vercel)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy (Vercel)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
