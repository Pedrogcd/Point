name: Deploy (GitHub Pages)

# Só publica se os testes passarem: o job "deploy" depende do "build", que
# depende do "test" (needs) — se qualquer um falhar, os seguintes não rodam.
#
# Passo único do lado do Pedro pro Pages em si: Settings → Pages → Source:
# GitHub Actions. Não precisa de conta externa, CLI nem tokens pra isso.
#
# O build também usa 2 secrets do Supabase (VITE_SUPABASE_URL e
# VITE_SUPABASE_ANON_KEY) — sem eles o app ainda builda e funciona, só que
# sempre em modo somente-leitura com localStorage (ver storage.js).

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
