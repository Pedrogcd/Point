name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Testes do motor (node --test)
        run: npm test

      - name: Build de produção
        run: npm run build
